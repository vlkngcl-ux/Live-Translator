name: Mac hız ölçümü (deneysel)

# Yalnızca "hiz-olcumu" dalına gönderimde çalışır. Sürüm YAYINLAMAZ; sadece ölçüm kaydı üretir.
on:
  push:
    branches: [hiz-olcumu]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Mevcut motorun modellerini önbellekten al (varsa)
        uses: actions/cache/restore@v4
        with:
          path: models
          key: models-v2-turbo-small-nllb600m-ct2-4.8.2-ro-en-tr
          enableCrossOsArchive: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt soundfile huggingface_hub
          pip install mlx-whisper
      - name: Ölç
        run: python scripts/bench_mac.py 10
        env:
          BENCH: mlx
