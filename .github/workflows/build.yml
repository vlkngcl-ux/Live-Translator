name: Kurulum dosyalarını oluştur

# Ne zaman çalışır?
#  - OTOMATİK: main dalına uygulamayı etkileyen bir değişiklik gönderildiğinde.
#    Sürüm numarası depodaki VERSION dosyasından alınır. O sürüm zaten yayınlanmışsa
#    üzerine YAZMAZ, hata verip durur: yeni sürüm için önce VERSION'ı artırın.
#  - ELLE: Actions → "Kurulum dosyalarını oluştur" → Run workflow (sürüm boş bırakılırsa
#    VERSION kullanılır; elle verilen sürüm mevcutsa bilerek üzerine yazılır).
# Sonuç Releases sayfasına "v<sürüm>" olarak yüklenir.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Sürüm numarası (boş = VERSION dosyası). Mevcut bir sürüm yazılırsa üzerine yazılır."
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build/**"
      - "installer/**"
      - "scripts/**"
      - "requirements.txt"
      - "VERSION"
      - ".github/workflows/build.yml"

permissions:
  contents: write   # Release oluşturup dosya yükleyebilmek için

# Aynı daldaki eski bir derleme hâlâ sürüyorsa iptal et; yalnızca en son kod derlensin.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  WHISPER_SIZES: "large-v3-turbo,small"
  # Modeller veya dönüştürücü sürümü değişirse bu anahtarı değiştirin (önbellek yenilenir).
  MODELS_KEY: models-v3-turbo-small-nllb600m-ct2-4.8.2-ro-en-tr-mlxturbo

jobs:
  version:
    name: Sürümü belirle
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          V="$INPUT_VERSION"
          if [ -z "$V" ]; then V="$(tr -d ' \r\n' < VERSION)"; fi
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Geçersiz sürüm: '$V' (biçim: 1.2.3)"; exit 1
          fi
          if [ "${{ github.event_name }}" = "push" ] && gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::v$V zaten yayınlanmış. Üzerine yazmamak için durduruldu. VERSION dosyasını artırın (ör. 1.1.1)."
            exit 1
          fi
          echo "Sürüm: $V (commit ${GITHUB_SHA::7})"
          echo "version=$V" >> "$GITHUB_OUTPUT"

  models:
    name: Modelleri hazırla
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: models
          key: ${{ env.MODELS_KEY }}
          enableCrossOsArchive: true
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - if: steps.cache.outputs.cache-hit != 'true'
        name: Modelleri indir ve int8'e çevir
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install ctranslate2==4.8.2 transformers==4.57.6 sentencepiece soundfile huggingface_hub
          python scripts/prepare_models.py "$WHISPER_SIZES"

  build:
    name: Derle (${{ matrix.name }})
    needs: [version, models]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS (Apple Silicon)
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Modelleri önbellekten al
        uses: actions/cache/restore@v4
        with:
          path: models
          key: ${{ env.MODELS_KEY }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.22.3
          python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      # Mac: Apple GPU motoru (MLX). Derleme makinesi macOS 26 olduğu için pip kendi başına
      # yalnızca macOS 26'da çalışan paketi seçer; macOS 14+ için olanı ZORLA kuruyoruz.
      # mlx-whisper --no-deps: resmi bağımlılığı olan torch çalışırken kullanılmıyor (paket şişmesin).
      - name: MLX kur (macOS)
        if: runner.os == 'macOS'
        run: |
          pip download --no-deps --only-binary=:all: --platform macosx_14_0_arm64 \
            --python-version 3.11 -d mlx-wheels mlx==0.32.3 mlx-metal==0.32.3
          ls mlx-wheels
          pip install --no-deps mlx-wheels/*.whl
          pip install --no-deps mlx-whisper==0.4.3
          pip install numba tiktoken more-itertools scipy
          python -c "import mlx.core as mx, mlx_whisper; print('MLX', mx.__version__, mx.default_device(), 'metal', mx.metal.is_available())"
          python -c "import sys, mlx_whisper; assert 'torch' not in sys.modules, 'torch yüklendi'; print('torch yok: OK')"

      - name: Sürümü ayarla
        shell: bash
        run: echo "VERSION=${{ needs.version.outputs.version }}" >> "$GITHUB_ENV"

      - name: Uygulamayı paketle
        run: pyinstaller build/app.spec --noconfirm --workpath pyi-work

      # Paketlenmiş uygulama gerçek bir Romence kaydı offline tanıyıp çeviriyor mu?
      - name: Kendi kendine test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\CanliCevirmen\CanliCevirmen.exe" `
                -ArgumentList "--selftest","selftest.json","models" -Wait -PassThru
          Get-Content selftest.json -Encoding UTF8
          if ($p.ExitCode -ne 0) { throw "Selftest başarısız (çıkış kodu $($p.ExitCode))" }

      - name: Kendi kendine test (macOS)
        if: runner.os == 'macOS'
        run: |
          set +e
          dist/CanliCevirmen.app/Contents/MacOS/CanliCevirmen --selftest selftest.json models
          code=$?
          cat selftest.json
          exit $code

      - name: Kurulum dosyası (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $default = "${env:ProgramFiles(x86)}\Inno Setup 6"
            if (-not (Test-Path "$default\ISCC.exe")) { choco install innosetup -y --no-progress }
            $env:PATH += ";$default"
          }
          iscc /DAppVersion=$env:VERSION installer\windows.iss
          Get-ChildItem dist-installer

      - name: Kurulum dosyası (macOS .dmg)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dmg dist-installer
          cp -R dist/CanliCevirmen.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Canli Cevirmen" -srcfolder dmg -ov -format UDZO \
            dist-installer/CanliCevirmen-macOS-AppleSilicon.dmg
          ls -lh dist-installer

      - name: Release'e yükle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Canlı Çevirmen $VERSION" \
              --notes "Windows: CanliCevirmen-Setup-Windows.exe — macOS (M1/M2/M3/M4): CanliCevirmen-macOS-AppleSilicon.dmg. Kurulum talimatı için README'ye bakın." \
            || true
          for f in dist-installer/*; do gh release upload "$TAG" "$f" --clobber; done
